{% load static i18n %}
<!-- Field Operator Guide & Expandable FAQ Modal -->
<div
  x-data="{
    open: false,
    activeItem: null,
    searchQuery: '',
    faqs: [
      {
        id: 1,
        q: 'How do I record a harvesting work entry and bill?',
        a: 'Navigate to Fleet &amp; Machines &rarr; New Work Entry, or press Ctrl+K and select New Harvesting Work Entry. Choose the machine, customer/farmer, billing type (Hourly, Acre, or Piece), input meter or time readings, advance paid, and click Save to automatically generate the bill invoice with WhatsApp share button.'
      },
      {
        id: 2,
        q: 'How does Farmer Udhar (Credit Ledger) work?',
        a: 'When an entry has balance unpaid (payment mode UDHAR), the balance is automatically posted to Customer Receivables. In Machines &rarr; Farmer Credit Ledger (Udhar Katha), you can view all outstanding amounts, filter by village, and send single-click WhatsApp payment reminders with payment links.'
      },
      {
        id: 3,
        q: 'How do I log diesel refills and fuel pump slips?',
        a: 'Go to Fuel &rarr; Log Fuel Refill. Select the machine or bulk storage drum, vendor/pump supplier, dispensed liters, and unit rate. The system updates the machine odometer/hour meter and computes fuel efficiency automatically.'
      },
      {
        id: 4,
        q: 'How do I switch to Sunlight Mode for outdoor visibility?',
        a: 'Tap the Theme icon in the top header bar to cycle between Dark &rarr; Sunlight &rarr; Light modes. Sunlight Mode provides ultra-high contrast black text on white backgrounds, engineered specifically for phone screens under bright field sunlight.'
      },
      {
        id: 5,
        q: 'What keyboard shortcuts are available?',
        a: 'Press Ctrl+K or / anywhere to open the Global Command Palette and spotlight search. Press Escape to dismiss any open modal or mobile drawer. Press Alt+N to quickly open the Quick Expense dialog.'
      },
      {
        id: 6,
        q: 'Can I use AgriBOS ERP when mobile network is weak in the field?',
        a: 'Yes! AgriBOS is an offline-capable Progressive Web App (PWA). Core static pages, layouts, and recent reports remain cached. When mobile connection drops, an offline status indicator appears, and queued transactions sync once network is restored.'
      }
    ],
    get filteredFaqs() {
      if (!this.searchQuery.trim()) return this.faqs;
      const q = this.searchQuery.toLowerCase();
      return this.faqs.filter(f => f.q.toLowerCase().includes(q) || f.a.toLowerCase().includes(q));
    },
    toggle(id) {
      this.activeItem = this.activeItem === id ? null : id;
      if (window.triggerHaptic) window.triggerHaptic(10);
    }
  }"
  @open-faq-modal.window="open = true"
  x-show="open"
  x-cloak
  class="fixed inset-0 z-50 overflow-y-auto"
  role="dialog"
  aria-modal="true"
  aria-labelledby="faq-modal-title"
>
  <!-- Backdrop -->
  <div
    x-show="open"
    x-transition:enter="ease-out duration-200"
    x-transition:enter-start="opacity-0"
    x-transition:enter-end="opacity-100"
    x-transition:leave="ease-in duration-150"
    x-transition:leave-start="opacity-100"
    x-transition:leave-end="opacity-0"
    @click="open = false"
    class="fixed inset-0 bg-black/80 backdrop-blur-sm transition-opacity"
  ></div>

  <!-- Modal Container -->
  <div class="flex min-h-full items-center justify-center p-3 sm:p-4 text-center">
    <div
      x-show="open"
      x-transition:enter="ease-out duration-200"
      x-transition:enter-start="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95"
      x-transition:enter-end="opacity-100 translate-y-0 sm:scale-100"
      x-transition:leave="ease-in duration-150"
      x-transition:leave-start="opacity-100 translate-y-0 sm:scale-100"
      x-transition:leave-end="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95"
      class="relative transform overflow-hidden rounded-2xl bg-[#131A26] border border-[#28354A] text-left shadow-2xl transition-all w-full max-w-2xl max-h-[90vh] flex flex-col"
    >
      <!-- Header -->
      <div class="flex items-center justify-between px-5 py-4 border-b border-[#28354A] bg-[#162032]/60">
        <div class="flex items-center gap-2.5">
          <div class="w-8 h-8 rounded-lg bg-emerald-500/20 text-emerald-400 flex items-center justify-center text-sm">
            <i class="bi bi-question-circle-fill"></i>
          </div>
          <div>
            <h3 id="faq-modal-title" class="text-sm font-bold text-white tracking-tight m-0">
              Field Operator Guide &amp; FAQ
            </h3>
            <p class="text-[11px] text-gray-400 m-0">Quick operational help for field staff and accountants</p>
          </div>
        </div>
        <button
          type="button"
          @click="open = false"
          class="p-2 rounded-lg text-gray-400 hover:text-white hover:bg-gray-800 transition-colors focus:outline-none min-h-[44px] min-w-[44px] flex items-center justify-center"
          aria-label="Close"
        >
          <i class="bi bi-x-lg text-sm"></i>
        </button>
      </div>

      <!-- Search Filter -->
      <div class="p-4 border-b border-[#28354A] bg-[#0E1522]">
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
            <i class="bi bi-search text-xs"></i>
          </span>
          <input
            type="text"
            x-model="searchQuery"
            placeholder="Search help topics (e.g. diesel, billing, offline, sunlight)..."
            class="w-full pl-9 pr-3 py-2 rounded-xl bg-[#162032] border border-[#28354A] text-xs text-white placeholder-gray-500 focus:outline-none focus:border-emerald-500 transition-colors"
          >
        </div>
      </div>

      <!-- Expandable FAQ Accordion List -->
      <div class="p-4 sm:p-5 overflow-y-auto flex-1 space-y-2.5">
        <template x-for="item in filteredFaqs" :key="item.id">
          <div class="rounded-xl border border-[#28354A] bg-[#162032]/50 overflow-hidden transition-colors">
            <button
              type="button"
              @click="toggle(item.id)"
              class="w-full px-4 py-3.5 flex items-center justify-between text-left text-xs font-semibold text-gray-200 hover:text-white hover:bg-gray-800/40 transition-colors focus:outline-none"
            >
              <span x-text="item.q"></span>
              <i
                class="bi bi-chevron-down text-gray-400 transition-transform duration-200 ms-2"
                :class="{ 'rotate-180 text-emerald-400': activeItem === item.id }"
              ></i>
            </button>
            <div
              x-show="activeItem === item.id"
              x-cloak
              class="px-4 pb-3.5 pt-1 text-[11px] leading-relaxed text-gray-300 border-t border-[#28354A]/60 bg-[#0E1522]/50"
            >
              <div x-html="item.a"></div>
            </div>
          </div>
        </template>

        <div x-show="filteredFaqs.length === 0" class="text-center py-6 text-xs text-gray-400">
          No matching help articles found for "<span x-text="searchQuery"></span>".
        </div>
      </div>

      <!-- Footer Note -->
      <div class="px-5 py-3 border-t border-[#28354A] bg-[#0E1522] flex items-center justify-between text-xs text-gray-400">
        <span class="text-[11px]">AgriBOS ERP &bull; Sri Basaveshwara &amp; Co.</span>
        <button
          type="button"
          @click="open = false"
          class="px-3.5 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white font-semibold text-xs transition-colors"
        >
          Got It
        </button>
      </div>
    </div>
  </div>
</div>

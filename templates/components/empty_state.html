{# Reusable Empty State Component #}
{# Parameters: icon, title, message, action_url, action_text #}
<div class="py-10 px-4 text-center flex flex-col items-center justify-center">
  <div class="w-12 h-12 rounded-lg bg-gray-800/80 border border-[#28354A] flex items-center justify-center text-xl text-gray-400 mb-3">
    <i class="{{ icon|default:'bi bi-inbox' }}"></i>
  </div>
  <h3 class="text-sm font-semibold text-white mb-1 m-0">{{ title|default:"No records found" }}</h3>
  <p class="text-xs text-gray-400 max-w-sm mb-4 mt-1 leading-relaxed">{{ message|default:"There is currently no data available yet." }}</p>
  {% if action_url and action_text %}
    <a href="{{ action_url }}" class="inline-flex items-center gap-2 px-4 py-2 rounded-md bg-[#1E3A8A] hover:bg-[#1E40AF] text-white font-semibold text-xs transition-colors no-underline focus:outline-none focus:ring-2 focus:ring-[#1E3A8A]" style="color: #FFFFFF !important;">
      <i class="bi bi-plus-lg"></i>
      <span>{{ action_text }}</span>
    </a>
  {% endif %}
</div>

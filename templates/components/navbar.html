<header class="app-topbar">
  <div class="d-flex align-items-center gap-3">
    <button class="btn btn-ghost d-lg-none p-2" id="sidebarToggle" aria-label="Toggle Navigation">
      <i class="bi bi-list fs-5"></i>
    </button>
    <div class="d-flex align-items-center gap-2">
      <span class="badge bg-secondary text-uppercase fw-semibold" style="font-size: 0.7rem;">Phase 1 Foundation</span>
      <span class="text-muted small d-none d-md-inline">Expense Tracking & Management System</span>
    </div>
  </div>

  <div class="d-flex align-items-center gap-3">
    <button class="btn btn-emerald btn-sm d-flex align-items-center gap-2" data-bs-toggle="modal" data-bs-target="#quickExpenseModal">
      <i class="bi bi-plus-lg"></i>
      <span class="d-none d-sm-inline">Quick Expense</span>
    </button>

    <div class="dropdown">
      <button class="btn btn-ghost btn-sm dropdown-toggle d-flex align-items-center gap-2" type="button" data-bs-toggle="dropdown">
        <i class="bi bi-person-circle"></i>
        <span>User</span>
      </button>
      <ul class="dropdown-menu dropdown-menu-end dropdown-menu-dark">
        <li><a class="dropdown-item" href="{% url 'accounts:profile' %}"><i class="bi bi-person me-2"></i>Profile</a></li>
        <li><hr class="dropdown-divider"></li>
        <li><a class="dropdown-item text-danger" href="{% url 'accounts:login' %}"><i class="bi bi-box-arrow-right me-2"></i>Logout</a></li>
      </ul>
    </div>
  </div>
</header>

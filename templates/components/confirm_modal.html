{# Generic Action Confirmation Modal (Alpine.js powered, CSRF POST) #}
<div
  class="fixed inset-0 z-50 overflow-y-auto bg-black/75 backdrop-blur-sm"
  id="confirmModal"
  role="dialog"
  aria-modal="true"
  aria-labelledby="confirmModalLabel"
  x-data="{ open: false, targetUrl: '', title: 'Confirm Action', message: 'Are you sure you want to proceed?', confirmLabel: 'Confirm & Proceed', variant: 'danger' }"
  x-show="open"
  x-cloak
  @open-confirm-modal.window="open = true; targetUrl = $event.detail.url; title = $event.detail.title || 'Confirm Action'; message = $event.detail.message || 'Are you sure you want to proceed?'; confirmLabel = $event.detail.confirmLabel || 'Confirm & Proceed'; variant = $event.detail.variant || 'danger';"
  @keydown.escape.window="open = false"
  x-transition:enter="transition ease-out duration-150"
  x-transition:enter-start="opacity-0"
  x-transition:enter-end="opacity-100"
  x-transition:leave="transition ease-in duration-100"
  x-transition:leave-start="opacity-100"
  x-transition:leave-end="opacity-0"
  @click.self="open = false"
>
  <div class="min-h-full flex items-center justify-center p-4" @click.self="open = false">
    <div class="relative w-full max-w-md bg-[#131A26] border border-[#28354A] rounded-2xl shadow-2xl overflow-hidden text-gray-100 max-h-[90vh] flex flex-col">
      <div class="px-6 py-4 border-b border-[#28354A] flex items-center justify-between bg-[#162030] flex-shrink-0">
        <div class="flex items-center gap-2.5">
          <div class="w-8 h-8 rounded-lg flex items-center justify-center border" :class="variant === 'warning' ? 'bg-amber-500/10 border-amber-500/30 text-amber-400' : 'bg-rose-500/10 border-rose-500/30 text-rose-400'">
            <i class="bi bi-exclamation-triangle-fill text-base"></i>
          </div>
          <h3 class="text-sm font-bold text-white tracking-tight m-0" id="confirmModalLabel" x-text="title">Confirm Action</h3>
        </div>
        <button type="button" class="text-gray-400 hover:text-white p-2 rounded-xl focus:outline-none min-h-[44px] min-w-[44px] flex items-center justify-center bg-transparent border-0 cursor-pointer" @click="open = false" aria-label="Close">
          <i class="bi bi-x-lg text-sm"></i>
        </button>
      </div>

      <div class="p-6 overflow-y-auto flex-1">
        <p class="text-xs text-gray-300 leading-relaxed m-0" x-text="message">Are you sure you want to proceed with this operation? This action may be irreversible.</p>
      </div>

      <div class="px-6 py-4 border-t border-[#28354A] flex items-center justify-end gap-3 bg-[#162030] flex-shrink-0">
        <button type="button" class="px-4 py-2.5 rounded-xl bg-gray-800 hover:bg-gray-700 text-gray-300 font-medium text-xs border border-gray-700 transition-colors min-h-[44px] flex items-center justify-center cursor-pointer" @click="open = false">
          Cancel
        </button>
        <form :action="targetUrl" method="post" class="m-0">
          {% csrf_token %}
          <button type="submit" class="px-5 py-2.5 rounded-xl text-white font-semibold text-xs shadow-md transition-all focus:outline-none focus:ring-2 min-h-[44px] flex items-center justify-center border-0 cursor-pointer" :class="variant === 'warning' ? 'bg-amber-600 hover:bg-amber-500 focus:ring-amber-400' : 'bg-rose-600 hover:bg-rose-500 shadow-rose-900/30 focus:ring-rose-400'" x-text="confirmLabel">
            Confirm &amp; Proceed
          </button>
        </form>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="quickExpenseModal" tabindex="-1" aria-labelledby="quickExpenseModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content" style="background-color: var(--theme-surface-card); border: 1px solid var(--theme-border);">
      <div class="modal-header border-bottom border-secondary">
        <h5 class="modal-title fs-6 fw-bold" id="quickExpenseModalLabel">Quick Expense Entry</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="alert alert-info py-2 small mb-3">
          <i class="bi bi-info-circle me-1"></i> Phase 1 Foundation Mode: Full quick expense engine will activate in Phase 4.
        </div>
        <form>
          <div class="mb-3">
            <label class="form-label small text-muted">Amount (₹)</label>
            <input type="text" class="form-control bg-dark text-white border-secondary num-tabular" placeholder="0.00" disabled>
          </div>
          <div class="mb-3">
            <label class="form-label small text-muted">Category</label>
            <select class="form-select bg-dark text-white border-secondary" disabled>
              <option>Select Category...</option>
            </select>
          </div>
        </form>
      </div>
      <div class="modal-footer border-top border-secondary">
        <button type="button" class="btn btn-ghost btn-sm" data-bs-dismiss="modal">Close</button>
        <button type="button" class="btn btn-emerald btn-sm" disabled>Record Expense</button>
      </div>
    </div>
  </div>
</div>

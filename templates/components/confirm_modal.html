{# Generic Action Confirmation Modal #}
<div
  class="modal fade fixed inset-0 z-50 overflow-y-auto"
  id="confirmModal"
  tabindex="-1"
  aria-labelledby="confirmModalLabel"
  aria-hidden="true"
  x-data="{ open: false, targetUrl: '', title: 'Confirm Action', message: 'Are you sure you want to proceed?' }"
  @open-confirm-modal.window="open = true; targetUrl = $event.detail.url; title = $event.detail.title; message = $event.detail.message"
  @keydown.escape.window="open = false"
>
  <div class="modal-dialog modal-dialog-centered min-h-[calc(100%-3.5rem)] flex items-center justify-center p-4">
    <div class="modal-content relative w-full max-w-md bg-[#131A26] border border-[#28354A] rounded-2xl shadow-2xl overflow-hidden text-gray-100">
      <div class="px-6 py-4 border-b border-[#28354A] flex items-center justify-between bg-[#162030]">
        <div class="flex items-center gap-2.5">
          <div class="w-8 h-8 rounded-lg bg-rose-500/10 border border-rose-500/30 flex items-center justify-center text-rose-400">
            <i class="bi bi-exclamation-triangle-fill text-base"></i>
          </div>
          <h3 class="text-sm font-bold text-white tracking-tight" id="confirmModalLabel" x-text="title">Confirm Action</h3>
        </div>
        <button type="button" class="btn-close text-gray-400 hover:text-white p-1 rounded-lg focus:outline-none" data-bs-dismiss="modal" @click="open = false" aria-label="Close">
          <i class="bi bi-x-lg text-sm"></i>
        </button>
      </div>

      <div class="p-6">
        <p class="text-xs text-gray-300 leading-relaxed" x-text="message">Are you sure you want to proceed with this operation? This action may be irreversible.</p>
      </div>

      <div class="px-6 py-4 border-t border-[#28354A] flex items-center justify-end gap-3 bg-[#162030]">
        <button type="button" class="px-4 py-2 rounded-xl bg-gray-800 hover:bg-gray-700 text-gray-300 font-medium text-xs border border-gray-700 transition-colors" data-bs-dismiss="modal" @click="open = false">
          Cancel
        </button>
        <form :action="targetUrl" method="post" class="m-0">
          {% csrf_token %}
          <button type="submit" class="px-4 py-2 rounded-xl bg-rose-600 hover:bg-rose-500 text-white font-semibold text-xs shadow-md shadow-rose-900/30 transition-all focus:outline-none focus:ring-2 focus:ring-rose-400">
            Confirm & Proceed
          </button>
        </form>
      </div>
    </div>
  </div>
</div>

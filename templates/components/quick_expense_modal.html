<!-- Quick Expense Modal -->
<div class="modal fade" id="quickExpenseModal" tabindex="-1" aria-labelledby="quickExpenseModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content bg-dark border-secondary text-white">
      <form id="quickExpenseForm" method="post" action="{% url 'expenses:api_quick' %}">
        {% csrf_token %}
        <div class="modal-header border-secondary">
          <h5 class="modal-title fs-6 fw-bold text-white" id="quickExpenseModalLabel">
            <i class="bi bi-lightning-fill text-warning me-2"></i>Quick Expense Entry
          </h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div id="quickExpenseAlert" class="alert alert-danger py-2 small d-none mb-3"></div>

          <div class="row g-3 mb-3">
            <div class="col-12 col-sm-6">
              <label class="form-label small text-muted">Amount (₹) *</label>
              <input type="number" step="0.01" name="amount" class="form-control form-control-lg bg-dark text-white border-secondary fw-bold" placeholder="0.00" required>
            </div>
            <div class="col-12 col-sm-6">
              <label class="form-label small text-muted">Category *</label>
              <select name="category_id" class="form-select form-select-lg bg-dark text-white border-secondary" required id="quickExpCat">
                <!-- Populated via API or standard choices -->
              </select>
            </div>
          </div>

          <div class="row g-3 mb-3">
            <div class="col-12 col-sm-6">
              <label class="form-label small text-muted">Account *</label>
              <select name="account_id" class="form-select bg-dark text-white border-secondary" required id="quickExpAcc">
                <!-- Populated via API or standard choices -->
              </select>
            </div>
            <div class="col-12 col-sm-6">
              <label class="form-label small text-muted">Payment Method *</label>
              <select name="payment_method" class="form-select bg-dark text-white border-secondary">
                <option value="CASH">Cash</option>
                <option value="UPI">UPI</option>
                <option value="BANK_TRANSFER">Bank Transfer</option>
              </select>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label small text-muted">Associated Machine (Optional)</label>
            <select name="machine_id" class="form-select bg-dark text-white border-secondary" id="quickExpMch">
              <option value="">-- None / General --</option>
            </select>
          </div>

          <div class="mb-2">
            <label class="form-label small text-muted">Quick Description / Item</label>
            <input type="text" name="description" class="form-control bg-dark text-white border-secondary" placeholder="e.g. Tractor grease, workshop welding">
          </div>
        </div>
        <div class="modal-footer border-secondary">
          <button type="button" class="btn btn-ghost btn-sm" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-emerald btn-sm" id="quickExpenseSubmitBtn">
            <i class="bi bi-check-lg me-1"></i> Post Expense
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

{% load static i18n %}
<!-- Modernized Mobile-First Quick Expense Modal -->
<div
  class="modal fade fixed inset-0 z-50 overflow-y-auto"
  id="quickExpenseModal"
  tabindex="-1"
  aria-labelledby="quickExpenseModalLabel"
  aria-hidden="true"
  x-show="quickExpenseOpen"
  x-init="$watch('quickExpenseOpen', val => { if (val && window.loadQuickExpenseOptions) window.loadQuickExpenseOptions(); })"
  @close-quick-expense.window="quickExpenseOpen = false"
  x-transition:enter="transition ease-out duration-200"
  x-transition:enter-start="opacity-0"
  x-transition:enter-end="opacity-100"
  x-transition:leave="transition ease-in duration-150"
  x-transition:leave-start="opacity-100"
  x-transition:leave-end="opacity-0"
  @click.self="quickExpenseOpen = false"
  @keydown.escape.window="quickExpenseOpen = false"
>
  <div class="modal-dialog modal-dialog-centered min-h-[calc(100%-3.5rem)] flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="modal-content relative w-full max-w-lg bg-[#131A26] border-t sm:border border-[#28354A] rounded-t-3xl sm:rounded-2xl shadow-2xl overflow-hidden text-gray-100 pb-6 sm:pb-0" style="padding-bottom: env(safe-area-inset-bottom, 0px);">
      <form id="quickExpenseForm" method="post" action="{% url 'api_expenses_quick' %}">
        {% csrf_token %}

        <!-- Mobile Touch Handle (Mobile Only) -->
        <div class="sm:hidden flex justify-center pt-3 pb-1">
          <div class="w-12 h-1.5 rounded-full bg-gray-600"></div>
        </div>

        <!-- Header -->
        <div class="px-5 sm:px-6 py-3.5 border-b border-[#28354A] flex items-center justify-between bg-[#162030]">
          <div class="flex items-center gap-2.5">
            <div class="w-8 h-8 rounded-lg bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-center text-emerald-400">
              <i class="bi bi-lightning-fill text-base"></i>
            </div>
            <div>
              <h3 class="text-sm font-bold text-white tracking-tight m-0" id="quickExpenseModalLabel">{% trans "Quick Expense Entry" %}</h3>
              <p class="text-[11px] text-gray-400 m-0">20s field expenditure (ವೆಚ್ಚ ದಾಖಲಾತಿ)</p>
            </div>
          </div>
          <button
            type="button"
            class="btn-close text-gray-400 hover:text-white p-2 rounded-xl focus:outline-none min-h-[44px] min-w-[44px] flex items-center justify-center"
            data-bs-dismiss="modal"
            @click="quickExpenseOpen = false"
            aria-label="Close"
          >
            <i class="bi bi-x-lg text-xs"></i>
          </button>
        </div>

        <!-- Body -->
        <div class="p-4 sm:p-6 space-y-3.5 sm:space-y-4">
          <div id="quickExpenseAlert" class="p-3 rounded-xl bg-rose-500/10 border border-rose-500/30 text-rose-300 text-xs hidden"></div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 sm:gap-4">
            <div>
              <label class="block text-xs font-semibold text-gray-300 mb-1.5" for="quickExpAmount">
                Amount (₹) <span class="text-rose-400">*</span>
              </label>
              <div class="relative">
                <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-emerald-400 font-extrabold text-lg">₹</span>
                <input
                  type="number"
                  step="0.01"
                  inputmode="decimal"
                  name="amount"
                  id="quickExpAmount"
                  class="w-full pl-9 pr-3 py-3 rounded-xl bg-[#0B0F17] border border-emerald-500/40 focus:border-emerald-400 focus:ring-2 focus:ring-emerald-400/20 text-white font-extrabold text-xl num-tabular placeholder-gray-600 focus:outline-none min-h-[50px]"
                  placeholder="0.00"
                  required
                >
              </div>
            </div>

            <div>
              <label class="block text-xs font-semibold text-gray-300 mb-1.5" for="quickExpCat">
                Category <span class="text-rose-400">*</span>
              </label>
              <select
                name="category_id"
                id="quickExpCat"
                class="w-full px-3 py-3 rounded-xl bg-[#0B0F17] border border-[#28354A] focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 text-white text-sm font-medium focus:outline-none min-h-[48px]"
                required
              >
                <option value="">Loading Categories...</option>
              </select>
            </div>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 sm:gap-4">
            <div>
              <label class="block text-xs font-semibold text-gray-300 mb-1.5" for="quickExpAcc">
                Payment Account <span class="text-rose-400">*</span>
              </label>
              <select
                name="account_id"
                id="quickExpAcc"
                class="w-full px-3 py-3 rounded-xl bg-[#0B0F17] border border-[#28354A] focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 text-white text-sm font-medium focus:outline-none min-h-[48px]"
                required
              >
                <option value="">Loading Accounts...</option>
              </select>
            </div>

            <div>
              <label class="block text-xs font-semibold text-gray-300 mb-1.5" for="quickExpMethod">
                Payment Method <span class="text-rose-400">*</span>
              </label>
              <select
                name="payment_method"
                id="quickExpMethod"
                class="w-full px-3 py-3 rounded-xl bg-[#0B0F17] border border-[#28354A] focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 text-white text-sm font-medium focus:outline-none min-h-[48px]"
              >
                <option value="CASH">Cash</option>
                <option value="UPI">UPI</option>
                <option value="BANK_TRANSFER">Bank Transfer</option>
              </select>
            </div>
          </div>

          <div>
            <label class="block text-xs font-semibold text-gray-300 mb-1.5" for="quickExpMch">
              Associated Machine <span class="text-gray-400 font-normal">(Optional)</span>
            </label>
            <select
              name="machine_id"
              id="quickExpMch"
              class="w-full px-3 py-2.5 rounded-xl bg-[#0B0F17] border border-[#28354A] focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 text-white text-sm font-medium focus:outline-none min-h-[48px]"
            >
              <option value="">-- None / General Enterprise --</option>
            </select>
          </div>

          <div>
            <div class="flex items-center justify-between mb-1.5">
              <label class="block text-xs font-semibold text-gray-300 m-0" for="quickExpDesc">
                Description / Notes
              </label>
              <button
                type="button"
                onclick="window.toggleVoiceDictation(this, 'quickExpDesc', 'kn-IN')"
                class="mic-btn flex items-center gap-1 text-[11px] font-semibold text-emerald-400 bg-emerald-500/10 hover:bg-emerald-500/20 border border-emerald-500/30 px-2 py-0.5 rounded-lg transition-all cursor-pointer"
                title="Speak Description"
                aria-pressed="false"
              >
                <i class="bi bi-mic-fill"></i>
                <span>🎤 Speak</span>
              </button>
            </div>

            <!-- Quick Chips -->
            <div class="flex items-center gap-1.5 flex-wrap mb-2">
              <button type="button" onclick="window.insertQuickChip('Grease & Oil', 'quickExpDesc')" class="quick-chip">
                🔧 Grease &amp; Oil
              </button>
              <button type="button" onclick="window.insertQuickChip('Blade Sharpening', 'quickExpDesc')" class="quick-chip quick-chip-amber">
                🔪 Blade Sharp
              </button>
              <button type="button" onclick="window.insertQuickChip('Operator Tiffin', 'quickExpDesc')" class="quick-chip quick-chip-cyan">
                🍱 Tiffin / Food
              </button>
              <button type="button" onclick="window.insertQuickChip('Welding Work', 'quickExpDesc')" class="quick-chip quick-chip-rose">
                👨‍🔧 Welding
              </button>
            </div>

            <input
              type="text"
              name="description"
              id="quickExpDesc"
              class="w-full px-3 py-2.5 rounded-xl bg-[#0B0F17] border border-[#28354A] focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 text-white text-sm placeholder-gray-600 focus:outline-none min-h-[48px]"
              placeholder="e.g. Tractor grease, spare bolt, hydraulic leak weld"
            >
          </div>
        </div>

        <!-- Footer Actions -->
        <div class="px-5 sm:px-6 py-3.5 border-t border-[#28354A] flex items-center justify-between sm:justify-end gap-3 bg-[#162030]">
          <button
            type="button"
            class="flex-1 sm:flex-none px-4 py-2.5 rounded-xl bg-gray-800 hover:bg-gray-700 text-gray-300 font-semibold text-xs border border-gray-700 transition-colors min-h-[48px] flex items-center justify-center"
            data-bs-dismiss="modal"
            @click="quickExpenseOpen = false"
          >
            Cancel
          </button>
          <button
            type="submit"
            id="quickExpenseSubmitBtn"
            class="flex-[2] sm:flex-none inline-flex items-center justify-center gap-2 px-6 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs shadow-lg shadow-emerald-900/30 transition-all focus:outline-none focus:ring-2 focus:ring-emerald-400 min-h-[48px] cursor-pointer"
          >
            <i class="bi bi-check-circle-fill"></i>
            <span>Post Expense</span>
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

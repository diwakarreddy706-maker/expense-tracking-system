{% extends 'base.html' %}

{% block title %}403 - Permission Denied | AgriBOS ERP{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-12 text-center">
  <div class="bg-[#131A26] border border-[#28354A] rounded-2xl p-8 shadow-sm">
    <div class="w-16 h-16 rounded-2xl bg-rose-500/10 border border-rose-500/30 flex items-center justify-center text-rose-400 mx-auto mb-4">
      <i class="bi bi-shield-lock-fill text-3xl"></i>
    </div>
    <h2 class="text-xl font-extrabold text-white tracking-tight m-0 mb-2">403 - Access Denied</h2>
    <p class="text-xs text-gray-400 leading-relaxed mb-6">You do not have the required operational permissions or role authorization to access this action.</p>
    <a href="{% url 'dashboard:index' %}" class="inline-flex items-center gap-2 px-5 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-semibold text-xs shadow-sm shadow-emerald-900/30 transition-all no-underline">
      <i class="bi bi-house"></i>
      <span>Return to Dashboard</span>
    </a>
  </div>
</div>
{% endblock %}

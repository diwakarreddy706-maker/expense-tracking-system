{% extends 'base.html' %}

{% block title %}404 - Page Not Found | AgriBOS ERP{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-12 text-center">
  <div class="bg-[#131A26] border border-[#28354A] rounded-2xl p-8 shadow-sm">
    <div class="w-16 h-16 rounded-2xl bg-amber-500/10 border border-amber-500/30 flex items-center justify-center text-amber-400 mx-auto mb-4">
      <i class="bi bi-compass text-3xl"></i>
    </div>
    <h2 class="text-xl font-extrabold text-white tracking-tight m-0 mb-2">404 - Page Not Found</h2>
    <p class="text-xs text-gray-400 leading-relaxed mb-6">The requested ERP resource, voucher, or registry entry does not exist or may have been deleted.</p>
    <a href="{% url 'dashboard:index' %}" class="inline-flex items-center gap-2 px-5 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-semibold text-xs shadow-sm shadow-emerald-900/30 transition-all no-underline">
      <i class="bi bi-house"></i>
      <span>Return to Dashboard</span>
    </a>
  </div>
</div>
{% endblock %}

services:
  db:
    image: mysql:8.0
    container_name: ets_mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${DB_NAME:-expense_tracking_db}
      MYSQL_USER: ${DB_USER:-expense_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}
    volumes:
      - ets_mysql_data:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - ets_network

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ets_web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: expense_tracking_core.settings.production
      DB_HOST: db
      DB_PORT: 3306
    volumes:
      - ets_static_volume:/app/staticfiles
      - ets_media_volume:/app/media
      - ets_logs_volume:/app/logs
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - ets_network

  nginx:
    image: nginx:alpine
    container_name: ets_nginx
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/expense_tracking.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/ssl:/etc/letsencrypt:ro
      - ets_static_volume:/var/www/expense_tracking/staticfiles:ro
      - ets_media_volume:/var/www/expense_tracking/media:ro
    networks:
      - ets_network

volumes:
  ets_mysql_data:
    name: ets_mysql_data
  ets_static_volume:
    name: ets_static_volume
  ets_media_volume:
    name: ets_media_volume
  ets_logs_volume:
    name: ets_logs_volume

networks:
  ets_network:
    name: ets_network
    driver: bridge
